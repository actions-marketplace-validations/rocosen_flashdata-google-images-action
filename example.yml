name: Google Images Inventory - FlashData
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Build an image-reference inventory with source URLs and reported
          dimensions for manual review.
        id: data
        uses: rocosen/flashdata-google-images-action@v0.1.0
        with:
          api-key: ${{ secrets.FLASHDATA_API_KEY }}
          query: rooftop solar installation
          options-json: '{"num":5}'
      - name: Save data for the next pipeline stage
        uses: actions/upload-artifact@v4
        with:
          name: google-images
          path: ${{ steps.data.outputs.artifact-directory }}
          retention-days: 7
